<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="password-box">
            <h1>Password Generator</h1>
            <p class="subtitle">Create a strong and secure password</p>

            <div class="password-display">
                <input type="text" id="password" placeholder="Your password" readonly>
                <button id="copyBtn">Copy</button>
            </div>

            <div class="settings">
                <div class="length-row">
                    <label for="length">Password Length</label>
                    <span id="lengthValue">12</span>
                </div>

                <input type="range" id="length" min="4" max="32" value="12">

                <label class="option">
                    <input type="checkbox" id="uppercase" checked>
                    <span>Include Uppercase Letters (A-Z)</span>
                </label>

                <label class="option">
                    <input type="checkbox" id="lowercase" checked>
                    <span>Include Lowercase Letters (a-z)</span>
                </label>

                <label class="option">
                    <input type="checkbox" id="numbers" checked>
                    <span>Include Numbers (0-9)</span>
                </label>

                <label class="option">
                    <input type="checkbox" id="symbols" checked>
                    <span>Include Symbols (!@#$%)</span>
                </label>
            </div>

            <button id="generateBtn" class="generate-btn">
                Generate Password
            </button>

            <p id="message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
